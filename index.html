            word-wrap: break-word;

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            });
            map.closePopup();
        }
        clearBtn.addEventListener('click', clearWilayahAndFilter);

        // ----- Filter Mitigasi -----
        var filterSelect = document.getElementById('filterMitigasi');
        filterSelect.addEventListener('change', function(e) {
            var selected = e.target.value;
            layer_kecamatan_diy_1.eachLayer(function(lyr) {
                var val = lyr.feature.properties['bahan skor_Mitigasi'];
                var match = (selected === 'all') || (val === selected);
                if (match) {
                    layer_kecamatan_diy_1.resetStyle(lyr);
                } else {
                    lyr.setStyle({ fillOpacity: 0.07, opacity: 0.12 });
                }
            });
        });

        // ----- Toggle sidebar (hide/show) -----
        var sidebarEl = document.getElementById('sidebar');
        var toggleBtn = document.getElementById('sidebarToggle');
        var toggleIcon = toggleBtn.querySelector('i');
        var sidebarOpen = true;

        function isMobile() {
            return window.innerWidth <= 768;
        }

        function positionMapControls() {
            var controls = document.querySelectorAll('.leaflet-top.leaflet-left');
            var offset = '12px';
            if (!isMobile() && sidebarOpen) {
                offset = (sidebarEl.offsetWidth + 12) + 'px';
            }
            controls.forEach(function(c) { c.style.left = offset; });
        }

        function setSidebarState(open) {
            sidebarOpen = open;
            sidebarEl.classList.toggle('collapsed', !open);
            toggleBtn.classList.toggle('collapsed', !open);
            toggleIcon.className = open ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
            positionMapControls();
        }

        toggleBtn.addEventListener('click', function() {
            setSidebarState(!sidebarOpen);
        });

        window.addEventListener('resize', function() {
            positionMapControls();
        });

        // Default: tersembunyi otomatis di layar kecil (handphone) agar tidak mengganggu peta
        setSidebarState(!isMobile());
        </script>        
    </body>
</html>
